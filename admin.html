<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#173a43"><title>Admin · ShowTime Hub</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body class="admin-page"><header class="topbar"><a class="brand" href="/"><span class="logo-mark">S</span><span>showtime<span class="accent">hub</span></span></a><span class="admin-label">ADMIN CONSOLE</span><a class="admin-link" href="/">Customer site ↗</a><button class="profile" id="admin-logout" hidden>Sign out</button></header>
<main class="admin-main"><section id="admin-login" class="admin-login"><p class="eyebrow">SHOWTIME HUB · STAFF ACCESS</p><h1>Admin sign in</h1><p>Manage movies, events, venues, seat inventory, showtimes and bookings.</p><form id="admin-login-form" class="stack-form"><label>Email<input name="email" type="email" autocomplete="username" required placeholder="admin@example.com"></label><label>Password<input name="password" type="password" autocomplete="current-password" required placeholder="Admin password"></label><button class="confirm wide">Sign in to admin</button><p class="form-error" id="admin-login-error"></p></form></section>
<section id="admin-app" hidden><div class="admin-welcome"><div><p class="eyebrow">CONTROL ROOM</p><h1>Booking operations</h1><p id="admin-greeting" class="section-note"></p></div><button class="confirm" data-action="refresh">Refresh data</button></div><div id="admin-stats" class="stats-grid"></div><div class="admin-tabs" role="tablist"><button class="active" data-panel="overview">Overview</button><button data-panel="titles">Movies & events</button><button data-panel="venues">Venues & seats</button><button data-panel="shows">Showtimes</button><button data-panel="bookings">Bookings</button></div><div id="admin-panel" class="admin-panel"></div></section></main><div id="seat-modal" class="modal"><div class="modal-box seat-modal-box"><button class="close" data-close-seats aria-label="Close">×</button><div id="seat-modal-content"></div></div></div><div class="toast" id="admin-toast"></div><script src="admin.js"></script></body></html>
